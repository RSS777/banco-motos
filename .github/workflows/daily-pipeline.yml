name: Daily content pipeline

on:
  schedule:
    # 06:00 America/Sao_Paulo (UTC-3), no DST in Brazil since 2019
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  run:
    # Self-hosted on the user's own VPS, not a GitHub-hosted runner: TikTok
    # silently withholds search results (page loads, the search XHR itself
    # never fires) from GitHub Actions' shared datacenter IP ranges — a
    # dedicated VPS IP has a real chance of not being flagged the same way.
    # See issue #8's close comment for how this was diagnosed.
    runs-on: [self-hosted, vps]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up virtualenv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Install browser binary
        # Not `scrapling install`: it also shells out to `sudo playwright
        # install-deps`, which has no password/askpass configured for the
        # unprivileged runner user. OS-level deps are pre-installed on this
        # VPS as root (see commit 8bcb998); only the browser binary itself
        # needs fetching here, cached under the runner's own HOME.
        run: .venv/bin/python -m playwright install chromium

      - name: Run daily pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: .venv/bin/python scripts/run_daily_pipeline.py
