<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>banco-motos — teste de push</title>
</head>
<body>
<h1>Teste manual de Web Push (ticket #9)</h1>
<p>Clique no botão, autorize a notificação quando o navegador pedir, e avise que assinou. Não feche esta aba.</p>
<button id="subscribe">Assinar notificações</button>
<pre id="log"></pre>

<script>
const SUPABASE_URL = "https://lfnncwknrmtifezxiqnd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_-FltxZra7lwIbk1OpsAJrg_EK1mDxXv";
const VAPID_PUBLIC_KEY = "BAgsKO6Dkl2d799sY9Y9i7J3kuk58GC7thLoCpIKdMF9HQTeS_JftcAKmc9Df6gJO21nG8OuMLQnpki-RRAbMUE";

const log = (msg) => { document.getElementById("log").textContent += msg + "\n"; console.log(msg); };

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

document.getElementById("subscribe").addEventListener("click", async () => {
  try {
    const reg = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    log("Service worker registrado.");

    const permission = await Notification.requestPermission();
    log("Permissão: " + permission);
    if (permission !== "granted") return;

    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    const json = sub.toJSON();
    log("Inscrito: " + json.endpoint);

    const resp = await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify({
        endpoint: json.endpoint,
        p256dh: json.keys.p256dh,
        auth: json.keys.auth,
      }),
    });
    if (resp.ok) {
      log("Subscription salva no Supabase. Pode avisar!");
    } else {
      log("Erro salvando no Supabase: " + resp.status + " " + (await resp.text()));
    }
  } catch (err) {
    log("Erro: " + err.message);
  }
});
</script>
</body>
</html>
